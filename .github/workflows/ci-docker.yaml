name: 🐳 CI Docker build

on:
  pull_request:

permissions:
  issues: write
  pull-requests: write

jobs:
  build-comment:

    name: Add the publish comment
    runs-on: ubuntu-latest
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Creating draft docker images
      - name: Add the publish comment
        id: add_comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ### 🐳 Creating draft docker images for this pull request.
            
            Releases are built for every commit on this pull request.
            
            #### The following packages have been published:
        
    outputs:
      comment-id: ${{ steps.add_comment.outputs.comment-id }}

  build:
    needs: 
      - build-comment
    name: Build and push docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packages: ["turbine", "ui", "simulation-ui", "simulation-server"]
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v3

      - name: ⛏️ Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: ⛏️ Setup Docker
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: ❓ Get current package version
        id: get_version
        run: echo version=$(cat ./packages/${{ matrix.packages }}/package.json | jq -r '.version') >> $GITHUB_OUTPUT

      - name: 👨‍💻 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: 🧱 Build Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./packages/${{ matrix.packages }}
          file: ./packages/${{ matrix.packages }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: | 
            nusterkit/${{ matrix.packages }}:${{ steps.get_version.outputs.version }}-${{ github.event.number }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Add the published tags to the pull request comments using the github api
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ needs.build-comment.outputs.comment-id }}
          body: |
            - **${{ matrix.packages }}**: [${{ steps.get_version.outputs.version }}-${{ github.event.number }}](https://hub.docker.com/repository/docker/nusterkit/${{ matrix.packages }}/tags?page=1&ordering=last_updated) ${{ steps.docker_build.outcome == 'success' && '✅ Built successfully' || '❌ Failed to build' }}
          token: ${{ secrets.GITHUB_TOKEN }}