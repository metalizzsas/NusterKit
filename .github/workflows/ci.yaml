name: 🚀 CI

on:
  pull_request:
  push:
    branches: [main]

# cancel in-progress runs on new commits to same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_ENV: development

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: ⛏️ Setup PNPM
        uses: pnpm/action-setup@v4

      - name: ⛏️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: 🗂️ Install packages
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Biome check
        run: pnpm exec biome check packages/

      - name: 🔍 TypeScript check (turbine)
        run: pnpm --filter @nuster/turbine exec tsc --noEmit

      - name: 🔍 TypeScript check (simulation-server)
        run: pnpm --filter @nuster/simulation-server exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: ⛏️ Setup PNPM
        uses: pnpm/action-setup@v4

      - name: ⛏️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: 🗂️ Install packages
        run: pnpm install --no-frozen-lockfile

      - name: 🔄 Sync packages
        run: pnpm run sync

      - name: ✔️ Run tests
        run: pnpm --filter @nuster/turbine exec vitest run --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    env:
      # `prisma generate` refuses to run without a datasource URL, and
      # `openapi:extract` boots the app, which queries the CallToAction table at
      # load time. The build therefore needs a real, migrated database — the
      # step below creates one. Absolute path so every step resolves it the
      # same way regardless of its working directory.
      DATABASE_URL: file:/tmp/nuster-ci.db
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: ⛏️ Setup PNPM
        uses: pnpm/action-setup@v4

      - name: ⛏️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: 🗂️ Install packages
        run: pnpm install --no-frozen-lockfile

      - name: 🔄 Sync packages
        run: pnpm run sync

      - name: 🗄️ Prepare the build database
        run: pnpm --filter @nuster/turbine exec prisma migrate deploy

      - name: 🧱 Build all packages
        run: pnpm run build

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: ⛏️ Setup PNPM
        uses: pnpm/action-setup@v4

      - name: ⛏️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: 🗂️ Install packages
        run: pnpm install --no-frozen-lockfile

      - name: 🔒 Audit dependencies
        run: pnpm audit --prod --audit-level=critical
