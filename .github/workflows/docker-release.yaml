name: 🐳 Docker build

on:
  workflow_call:
    inputs:
      moving_tag:
        description: >
          Tag mobile publié en plus du numéro de version.
          `latest` depuis main, `beta` depuis la branche beta — pour qu'une
          publication beta ne déplace jamais `latest`.
        required: false
        type: string
        default: latest

jobs:
  build:
    name: Build and push docker images
    runs-on: ubuntu-latest
    strategy:
      # The four images are independent. Without this, the first failure cancels
      # the others and hides whether they would have built.
      fail-fast: false
      matrix:
        packages: ["turbine", "ui", "simulation-ui", "simulation-server"]
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v3

      - name: ❓ Get current package version
        id: get_version
        run: echo version=$(cat ./packages/${{ matrix.packages }}/package.json | jq -r '.version') >> $GITHUB_OUTPUT

      - name: ⛏️ Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: ⛏️ Setup Docker
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 👨‍💻 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      # Le job n'est plus déclenché par une publication npm : il tourne à chaque
      # fois, et c'est ici qu'on décide. `imagetools inspect` sort en erreur si
      # le tag n'existe pas — buildx est déjà installé, et l'appel passe par le
      # login ci-dessus, donc il fonctionne aussi sur un dépôt privé.
      - name: ❓ Does this version already have an image?
        id: image_exists
        run: |
          image="nusterkit/${{ matrix.packages }}:${{ steps.get_version.outputs.version }}"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "$image exists already — skipping the build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "$image is missing — building."
          fi

      - name: 🧱 Build Docker image
        if: steps.image_exists.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./packages/${{ matrix.packages }}
          file: ./packages/${{ matrix.packages }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: | 
            nusterkit/${{ matrix.packages }}:${{ steps.get_version.outputs.version }} 
            nusterkit/${{ matrix.packages }}:${{ inputs.moving_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
