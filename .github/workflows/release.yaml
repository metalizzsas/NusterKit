name: 🚀 Release

on:
  push:
    branches:
      - main
      # Canal beta : mêmes étapes que main, mais changesets y tourne en mode
      # `pre` (cf. .changeset/pre.json) — il publie donc des versions
      # `x.y.z-beta.n` sous le dist-tag npm `beta`. Les ranges semver des
      # consommateurs (`^2.3.1`) ignorent les prereleases : rien ne bouge
      # pour main tant qu'on n'a pas fait `changeset pre exit`.
      - beta

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

    name: 📝 Changeset
    runs-on: ubuntu-latest
    if: github.repository == 'metalizzsas/nusterkit'

    env:
      # `prisma generate` refuses to run without a datasource URL, and
      # `openapi:extract` boots the app, which queries the CallToAction table at
      # load time. The build therefore needs a real, migrated database — the
      # step below creates one. Absolute path so every step resolves it the
      # same way regardless of its working directory.
      DATABASE_URL: file:/tmp/nuster-ci.db
    steps:
      - name: 📚 Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits

      - name: ⛏️ Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: ⛏️ Setup node
        uses: actions/setup-node@v3.4.1
        with:
          node-version: '24.x'
          cache: 'pnpm'

      # Trusted publishing needs npm >= 11.5.1. `changeset publish` delegates to
      # `pnpm publish`, which on pnpm 10 delegates in turn to npm — so it is npm
      # that performs the OIDC exchange. Node 24 currently ships 11.9.0, but the
      # runner image lags behind, and an older 24.x would ship an npm too old.
      - name: ⛏️ Upgrade npm
        run: npm install -g npm@latest

      - name: 📚 Install workspace packages
        run: pnpm install --no-frozen-lockfile

      - name: 🗄️ Prepare the build database
        run: pnpm --filter @nuster/turbine exec prisma migrate deploy

      - name: 🧱 Build all packages
        run: pnpm build

      - name: 📝 Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm release
          version: pnpm run version
          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-builds:

    needs: release
    # `needs` pour l'ordre seulement : les images se construisent depuis les
    # sources et ne consomment rien de l'étape de publication. Sans ce
    # `!cancelled()`, un échec de publication npm — y compris le cas « rien à
    # publier », où changesets tente de republier une version existante —
    # empêchait toute image de sortir.
    if: ${{ !cancelled() }}

    # Volontairement PAS conditionné à `published == 'true'`. Les images étaient
    # jusqu'ici l'effet de bord d'une publication npm : un correctif portant
    # uniquement sur un Dockerfile ne pouvait donc produire aucune image sans
    # consommer un numéro de version, et une version publiée dont le build
    # d'image échouait restait définitivement sans image. Le job tourne
    # maintenant à chaque fois et chaque image décide, paquet par paquet, si sa
    # version manque au registre.
    name: 🐳 Publish docker images
    # Référence locale (et non `@main`) : la branche beta doit utiliser SA
    # version du workflow appelé, sinon elle appellerait celle de main — qui
    # ne connaît pas l'entrée `moving_tag`.
    uses: ./.github/workflows/docker-release.yaml
    with:
      # main -> `latest`, beta -> `beta`. Une beta ne déplace jamais `latest`.
      moving_tag: ${{ github.ref_name == 'main' && 'latest' || 'beta' }}
    secrets: inherit
